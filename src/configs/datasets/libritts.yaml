# LibriTTS partitions.
#
# `subsets` is a mapping of LibriTTS subset -> on/off, so parts of the corpus
# can be added to or dropped from a run by flipping a flag instead of editing
# a list. A subset switched off is never scanned, so it costs nothing.
# A plain list (["train-clean-100", "train-clean-360"]) still works and means
# "all of these".
#
# From the command line:
#   python train.py 'datasets.train.subsets.train-clean-360=true'
#
# val and test read their own LibriTTS subsets, so the hash-based split inside
# the dataset is switched off everywhere (`part: all`): every partition takes
# all of its own subsets. To go back to splitting one subset by hash instead,
# set `part` to train/val/test and give val_ratio/test_ratio non-zero values.

train:
  _target_: src.datasets.libri_tts_dataset.LibriTTSDataset
  root_dir: ${hydra:runtime.cwd}/data/LibriTTS
  subsets:
    train-clean-100: true
    train-clean-360: false
    train-other-500: false
  part: all
  val_ratio: 0.0
  test_ratio: 0.0
  split_seed: 42
  segment_size: 16384
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0
  min_duration_sec: 0.5
  max_duration_sec: null
  max_files_per_speaker: null
  limit: null
  shuffle_index: true

val:
  _target_: src.datasets.libri_tts_dataset.LibriTTSDataset
  root_dir: ${datasets.train.root_dir}
  subsets:
    dev-clean: true
    dev-other: false
  part: all
  val_ratio: ${datasets.train.val_ratio}
  test_ratio: ${datasets.train.test_ratio}
  split_seed: ${datasets.train.split_seed}
  segment_size: ${datasets.train.segment_size}
  sample_rate: ${datasets.train.sample_rate}
  n_fft: ${datasets.train.n_fft}
  hop_length: ${datasets.train.hop_length}
  n_mels: ${datasets.train.n_mels}
  f_min: ${datasets.train.f_min}
  f_max: ${datasets.train.f_max}
  min_duration_sec: ${datasets.train.min_duration_sec}
  max_duration_sec: ${datasets.train.max_duration_sec}
  limit: 500
  shuffle_index: true

test:
  _target_: src.datasets.libri_tts_dataset.LibriTTSDataset
  root_dir: ${datasets.train.root_dir}
  subsets:
    test-clean: true
    test-other: false
  part: all
  val_ratio: ${datasets.train.val_ratio}
  test_ratio: ${datasets.train.test_ratio}
  split_seed: ${datasets.train.split_seed}
  segment_size: ${datasets.train.segment_size}
  sample_rate: ${datasets.train.sample_rate}
  n_fft: ${datasets.train.n_fft}
  hop_length: ${datasets.train.hop_length}
  n_mels: ${datasets.train.n_mels}
  f_min: ${datasets.train.f_min}
  f_max: ${datasets.train.f_max}
  min_duration_sec: ${datasets.train.min_duration_sec}
  max_duration_sec: ${datasets.train.max_duration_sec}
  limit: 600
  shuffle_index: true
